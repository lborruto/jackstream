name: CodeQL

# GitHub's code scanning on the Go sources: on pull requests, on pushes to main (the baseline
# pull requests are compared with) and once a week, so a new query finds old code too. The
# results go to the repository's Security tab. Go is analysed while it builds (autobuild); no
# code from the repository runs with more than read access.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays, 05:23 UTC.
    - cron: "23 5 * * 1"

permissions:
  contents: read

# A new push supersedes the running analysis of the same ref.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

# Every action is pinned to the commit of a release at least two weeks old (resolved from its
# tag on 2026-11-07); the comment names the release and the date it was published. Dependabot
# updates the version but not the date; its 14-day cooldown keeps the age rule.
jobs:
  analyze:
    name: CodeQL (go)
    # Code scanning needs a public repository on GitHub Free.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      # Upload of the results to code scanning; nothing else is written.
      security-events: write
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (2026-07-20)
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 (2026-07-16)
        with:
          go-version: "1.26"
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.0 (2026-10-15)
        with:
          languages: go
          build-mode: autobuild
          # The default suite plus the extended security queries.
          queries: security-extended
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.0 (2026-10-15)
        with:
          category: /language:go
