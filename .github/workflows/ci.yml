name: CI

# Every pull request and every push to main: gofmt, go vet and the unit tests (with the race
# detector), a check that the embedded copies match their sources, the image built for both
# architectures and started once, Trivy on it, a secret scan of the whole history, and actionlint
# and shellcheck on the workflows and the script. CodeQL runs from codeql.yml. Tags are not
# pushes here: release.yml calls this workflow on the tagged commit.
# A branch is checked through its pull request only, so each change runs once, not once for the
# push and again for the pull request.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

# A new push supersedes the running checks of the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every action is pinned to the commit of a release at least two weeks old (resolved from its
# tag on 2026-11-07); the comment names the release and the date it was published. Dependabot
# updates the version but not the date; its 14-day cooldown keeps the age rule.
jobs:
  # Docs-only pull requests skip the heavy jobs: they report "skipped", and the "CI result" job
  # below (the one check to require) passes. A push (main, or a tag through release.yml) always
  # runs everything. Only the runner's own variables are read: no event payload.
  changes:
    name: Changed files
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (2026-07-20)
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: filter
        run: |
          base=""
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ -n "${GITHUB_BASE_REF:-}" ]; then
            base="$(git merge-base "origin/$GITHUB_BASE_REF" HEAD || true)"
          fi
          if [ -z "$base" ]; then
            echo "code=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          # Anything outside these paths is code: Markdown, docs/, LICENSE and issue templates are
          # not.
          code="$(git diff --name-only "$base" HEAD | grep -vE '\.md$|^docs/|^LICENSE$|^\.github/ISSUE_TEMPLATE/' || true)"
          if [ -n "$code" ]; then echo "code=true"; else echo "code=false"; fi >>"$GITHUB_OUTPUT"

  lint:
    name: Workflows (actionlint, shellcheck)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      # rhysd/actionlint release v1.7.12 (2026-03-30), linux_amd64 archive. The checksum is the
      # one in the release's checksums.txt; the download is verified against it before use.
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (2026-07-20)
        with:
          persist-credentials: false
      - name: Install actionlint (checksum verified)
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          cd "$RUNNER_TEMP"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" actionlint
          rm "$archive"
      # actionlint runs shellcheck (preinstalled on the runner) on every run: script; the
      # repository's own script is checked directly.
      - run: |
          shellcheck --version
          "$RUNNER_TEMP/actionlint" -color
          shellcheck scripts/*.sh

  secrets:
    name: Secrets (gitleaks, whole history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # gitleaks release v8.30.1 (2026-03-21), linux_x64 archive. The checksum is the one in the
      # release's checksums.txt; the download is verified against it before use.
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (2026-07-20)
        with:
          persist-credentials: false
          # The whole history, every branch: a secret removed in a later commit is still a leak.
          fetch-depth: 0
      - name: Install gitleaks (checksum verified)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          cd "$RUNNER_TEMP"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          rm "$archive"
      # The default rules plus .gitleaks.toml (the public local-ip key, two paths). Findings are
      # printed redacted.
      - run: |
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --verbose --exit-code 1 --config .gitleaks.toml .

  # The Go version the image is built with (Dockerfile), and no other: GOTOOLCHAIN=local keeps
  # go.mod's toolchain line from downloading another one. The unit tests need no network.
  go:
    name: Go (gofmt, vet, test, embedded copies)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (2026-07-20)
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 (2026-07-16)
        with:
          go-version: "1.26"
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::not gofmt-formatted: $unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go test -race ./...
      # configure.html and the fallback keypair are embedded from copies (//go:embed does not
      # follow symlinks): `go generate` must leave them unchanged.
      - name: Embedded copies match their sources
        run: |
          go generate ./...
          if ! git diff --exit-code; then
            echo "::error::run 'go generate ./...' and commit the copies"
            exit 1
          fi
      - run: go build -trimpath -o "$RUNNER_TEMP/jackstream" ./cmd/jackstream

  # The image the release publishes, built for both architectures (the Dockerfile cross-compiles,
  # no emulation), then the amd64 one started once and scanned. Fixable HIGH and CRITICAL
  # vulnerabilities fail the job; unfixed ones are reported only.
  image:
    name: Image (build, start, Trivy)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (2026-07-20)
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1 (2026-09-16)
      - name: Build (linux/amd64, linux/arm64)
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 --output type=cacheonly .
          docker buildx build --platform linux/amd64 --load --tag jackstream:ci .
      - name: Start it and ask for /health and the manifest
        run: |
          docker run -d --name jackstream-ci -p 127.0.0.1:7000:7000 jackstream:ci
          ok=""
          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:7000/health; then ok=1; break; fi
            sleep 1
          done
          docker logs jackstream-ci
          test -n "$ok"
          curl -fsS http://127.0.0.1:7000/manifest.json | grep -q '"id":"community.jackstream"'
          curl -fsS -o /dev/null http://127.0.0.1:7000/configure
          docker rm -f jackstream-ci
      - name: Trivy on the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 (2026-04-22)
        with:
          scan-type: image
          image-ref: jackstream:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  # The one check to require: green when every job passed or was skipped as docs-only.
  result:
    name: CI result
    if: always()
    needs: [changes, lint, secrets, go, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "jobs: $RESULTS"
          for r in $RESULTS; do
            case "$r" in success | skipped) ;; *) exit 1 ;; esac
          done
